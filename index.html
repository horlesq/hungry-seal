<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <meta name="theme-color" content="#041a31" />
    <meta
      name="description"
      content="Hungry Seal: a bright, chunky arcade swim-and-eat game. Gobble fish, grow 8 sizes, dodge sharks and beat the squid bosses."
    />
    <title>Hungry Seal</title>
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="apple-touch-icon" href="./icons/apple-touch-icon.png" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <style>
      html,
      body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #041a31;
        overscroll-behavior: none;
        touch-action: none;
        -webkit-user-select: none;
        user-select: none;
        -webkit-tap-highlight-color: transparent;
      }
      #game {
        width: 100%;
        height: 100%;
      }
      canvas {
        display: block;
      }
      /* Shown while the script and font download; main.ts removes it once Phaser runs
         (PreloadScene then shows its own progress bar). */
      #boot {
        position: fixed;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 18px;
        color: #e9fbff;
        font:
          800 28px/1.2 system-ui,
          sans-serif;
        transition: opacity 0.25s;
        pointer-events: none;
      }
      #boot img {
        width: 72px;
        height: 72px;
        animation: bob 1.4s ease-in-out infinite alternate;
      }
      #boot .bar {
        width: 200px;
        height: 8px;
        border-radius: 4px;
        background: #0f3d66;
        overflow: hidden;
      }
      #boot .bar::after {
        content: '';
        display: block;
        width: 40%;
        height: 100%;
        border-radius: 4px;
        background: #7fe8f5;
        animation: slide 1.1s ease-in-out infinite alternate;
      }
      #boot noscript {
        font-size: 18px;
        font-weight: 600;
      }
      @keyframes bob {
        to {
          transform: translateY(-10px);
        }
      }
      @keyframes slide {
        to {
          transform: translateX(150%);
        }
      }
      @media (prefers-reduced-motion: reduce) {
        #boot img,
        #boot .bar::after {
          animation: none;
        }
      }
    </style>
  </head>
  <body>
    <div id="game"></div>
    <div id="boot" aria-live="polite">
      <img src="./favicon.svg" alt="" />
      <div>Hungry Seal</div>
      <div class="bar" role="progressbar" aria-label="Loading"></div>
      <noscript>Hungry Seal needs JavaScript to play.</noscript>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
